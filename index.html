const SYSTEM_QUIZ_TEMPLATE = `You make multiple-choice quizzes. Output JSON only.

The JSON has this exact shape:
{"topic":"...", "questions":[{"q":"...", "options":["A","B","C","D"], "correct":0, "explain":"..."}]}

You generate exactly {COUNT} questions.

Be tolerant of imperfect user input:
- Understand minor typos, e.g. "abou" means "about", "quizz" means "quiz".
- Ignore helper phrases such as "quiz about", "test about", "make a quiz about", "can you quiz me on".
- Extract the real study topic from the user request.

DEFAULT: generate the quiz directly.

If the topic is broad, create a general overview quiz.
Examples:
- "WW2" means a general World War II quiz.
- "quiz about WW2" means a general World War II quiz.
- "quiz abou WW2" means a general World War II quiz.

- "biology" means a broad biology quiz.

- "English grammar" means an English grammar quiz.

// â”€â”€ Utilities â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function formatDate(ts) {
  if (!ts) return "recently";
  const d = new Date(ts);
  const now = new Date();
  const diffMs = now - d;
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  if (diffDays === 0) return "today";
  if (diffDays === 1) return "yesterday";
  if (diffDays < 7) return `${diffDays} days ago`;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function formatDuration(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60), sec = s % 60;
  return `${m}m ${sec}s`;
}

function escHtml(t) {
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Normalize the user's study request:
// - fix common typos (abou â†’ about, quizz â†’ quiz, flaschards â†’ flashcards, etc.)
// - strip helper phrases ("quiz about", "make me a quiz about", "test me on", "flashcards about", â€¦)
// so the AI receives just the actual topic. Falls back to original text if regexes don't match.
function normalizeStudyRequest(text) {
  return String(text || "")
    .trim()
    .replace(/\babou\b/gi, "about")
    .replace(/\bquizz\b/gi, "quiz")
    .replace(/\bflaschards\b/gi, "flashcards")
    .replace(/\bflascards\b/gi, "flashcards")
    .replace(/\bstuddy\b/gi, "study")
    .replace(/^(please\s+)?(can\s+you\s+)?(make\s+|create\s+|generate\s+)?(me\s+)?(a\s+)?(quiz|test)\s+(about|on|for)\s+/i, "")
    .replace(/^(please\s+)?(can\s+you\s+)?(quiz|test)\s+(me\s+)?(about|on)\s+/i, "")
    .replace(/^(please\s+)?(can\s+you\s+)?(make\s+|create\s+|generate\s+)?(some\s+)?(flashcards|flashcard|cards)\s+(about|on|for)\s+/i, "")
    .replace(/^(please\s+)?(can\s+you\s+)?(help\s+me\s+study\s+)?(about|on)\s+/i, "")
    .trim();
}

// Decide whether to actually surface the AI's "needsClarification" response to the user.
// Most broad study topics (WW2, biology, math, photosynthesis, Spanish verbs, ...) should NEVER
// trigger the clarify UI â€” the app forces a regenerate instead. Only a small allow-list of
// truly ambiguous single words is allowed through.
function shouldAllowClarification(topic) {
  const t = String(topic || "").trim().toLowerCase();

  // Only allow clarification for a small set of truly ambiguous single-word topics.
  const ambiguousSingleTerms = [
    "mercury",
    "apple",
    "java",
    "python",
    "ruby",
    "go",
    "swift"
  ];

  return ambiguousSingleTerms.includes(t);
}

// Robust JSON extractor â€” pulls out the FIRST valid JSON object from a possibly-messy AI reply.
// Handles markdown code fences, leading/trailing prose, and nested braces inside strings.
function extractJson(text) {
  if (!text) return null;
  // 1) Strip code fences first.
  let s = String(text).replace(/```json\s*/gi, "").replace(/```/g, "").trim();
  // 2) Try a straight parse â€” fastest path.
  try { return JSON.parse(s); } catch(e) {}
  // 3) Walk the string and find a balanced { ... } block, ignoring braces inside strings.
  const start = s.indexOf("{");
  if (start === -1) return null;
  let depth = 0, inStr = false, esc = false;
  for (let i = start; i < s.length; i++) {
    const c = s[i];
    if (inStr) {
      if (esc) { esc = false; }
      else if (c === "\\") { esc = true; }
      else if (c === "\"") { inStr = false; }
    } else {
      if (c === "\"") inStr = true;
      else if (c === "{") depth++;
      else if (c === "}") {
        depth--;
        if (depth === 0) {
          const candidate = s.slice(start, i + 1);
          try { return JSON.parse(candidate); } catch(_) { return null; }
        }
      }
    }
  }
  return null;
}

function renderMd(text) {
  if (!text) return "";
  let html = escHtml(text)
    .replace(/`([^`\n]+)`/g, `<code style="background:rgba(99,102,241,0.12);padding:2px 7px;border-radius:5px;font-size:12.5px;font-family:'JetBrains Mono',monospace;color:#a5b4fc;">$1</code>`)
    .replace(/\*\*(.*?)\*\*/g, "<strong style='color:#fff;font-weight:600;'>$1</strong>")
    .replace(/\*(.*?)\*/g, "<em style='color:#d1d5db;'>$1</em>")
    .replace(/^## (.+)$/gm, `<div style="font-size:14px;font-weight:600;color:#818cf8;margin:14px 0 6px;letter-spacing:-0.01em;">$1</div>`)
    .replace(/^# (.+)$/gm, `<div style="font-size:16px;font-weight:700;color:#fff;margin:14px 0 8px;">$1</div>`)
    .replace(/^\d+\.\s+(.+)$/gm, `<div style="display:flex;gap:10px;margin:5px 0;"><span style="color:#818cf8;min-width:18px;font-size:12px;font-weight:600;">â€˘</span><span>$1</span></div>`)
    .replace(/^[-*]\s+(.+)$/gm, `<div style="display:flex;gap:10px;margin:4px 0;"><span style="color:#818cf8;min-width:18px;font-size:14px;line-height:1.3;">Â·</span><span>$1</span></div>`)
    .replace(/\n\n/g, `<div style="height:8px;"></div>`)
    .replace(/\n/g, "<br/>");
  return html;
}

// Copy text to clipboard with a graceful fallback for non-secure contexts (file://, http).
async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch(e) { return false; }
}

// AUTH SCREEN â€” Honest local profile (no password, demo-friendly)
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function AuthScreen({ onAuth, onGuest }) {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = () => {
    setErr("");
    if (!name.trim()) { setErr("Please enter your name."); return; }
    if (!email.includes("@") || !email.includes(".")) { setErr("Please enter a valid email."); return; }
    setLoading(true);
    try {
      const userKey = `yolvi:user:${email.toLowerCase()}`;
      // Restore existing local profile or create a fresh one
      let user;
      try {
        const existing = localStorage.getItem(userKey);
        if (existing) {
          user = JSON.parse(existing);
          // Migration: remove legacy password field if present
          let migrated = false;
          if (user && "password" in user) { delete user.password; migrated = true; }
          if (user.name !== name.trim()) { user.name = name.trim(); migrated = true; }
          if (migrated) {
            try { localStorage.setItem(userKey, JSON.stringify(user)); } catch(e) {}
          }
        }
      } catch(e) {}
      if (!user) {
        user = { name: name.trim(), email: email.toLowerCase(), createdAt: Date.now() };
        localStorage.setItem(userKey, JSON.stringify(user));
      }
      localStorage.setItem("yolvi:session", email.toLowerCase());
      onAuth(user);
    } catch(e) { setErr("Something went wrong. Try again."); }
    setLoading(false);
  };

  const continueAsGuest = () => {
    onGuest();
  };

  return (
    <div style={{ position:"fixed",inset:0,background:"linear-gradient(180deg,#0a0a14 0%,#13132a 100%)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:24,fontFamily:"'Inter',sans-serif",overflow:"auto",paddingTop:"max(24px, env(safe-area-inset-top))",paddingBottom:"max(24px, env(safe-area-inset-bottom))" }}>
      <style>{`
        .y-input{background:rgba(255,255,255,0.04)!important;border:1.5px solid rgba(255,255,255,0.08)!important;border-radius:12px!important;padding:14px 16px!important;color:#fff!important;font-family:'Inter',sans-serif!important;font-size:14px!important;font-weight:400!important;width:100%!important;transition:all 0.2s!important;box-sizing:border-box!important;}
        .y-input:focus{outline:none!important;border-color:#6366f1!important;background:rgba(99,102,241,0.05)!important;}
        .y-input::placeholder{color:#4b5563!important;}
      `}</style>
      <div style={{ position:"absolute",top:"15%",left:"50%",transform:"translateX(-50%)",width:400,height:300,background:"radial-gradient(ellipse,rgba(99,102,241,0.12) 0%,transparent 70%)",pointerEvents:"none",filter:"blur(40px)" }}/>

      <div style={{ maxWidth:380,width:"100%",position:"relative",zIndex:1 }}>
        <div style={{ textAlign:"center",marginBottom:32 }}>
          <div style={{ marginBottom:14 }}><Logo size={50} glow/></div>
          <div style={{ fontSize:26,fontWeight:700,color:"#fff",letterSpacing:"-0.02em",marginBottom:6 }}>{APP_NAME}</div>
          <div style={{ fontSize:13,color:"#9ca3af" }}>{APP_TAGLINE}</div>
        </div>

        <div style={{ marginBottom:20,textAlign:"center" }}>
          <div style={{ fontSize:22,fontWeight:700,color:"#fff",marginBottom:6,letterSpacing:"-0.02em" }}>
            Create your profile
          </div>
          <div style={{ fontSize:13,color:"#9ca3af",lineHeight:1.5 }}>
            Stored locally on your device.<br/>No account, no password â€” just learning.
          </div>
        </div>

        <div style={{ display:"flex",flexDirection:"column",gap:11,marginBottom:14 }}>
          <input className="y-input" placeholder="Your name" value={name} onChange={e=>{setName(e.target.value); setErr("");}} onKeyDown={e=>e.key==="Enter"&&submit()}/>
          <input className="y-input" type="email" placeholder="Email address" value={email} onChange={e=>{setEmail(e.target.value); setErr("");}} onKeyDown={e=>e.key==="Enter"&&submit()}/>
        </div>

        {err && <div style={{ marginBottom:14,padding:"10px 14px",fontSize:12,color:"#fca5a5",background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:10,textAlign:"center" }}>{err}</div>}

        <button onClick={submit} disabled={loading} style={{
          width:"100%",padding:"14px",
          background: loading ? "rgba(99,102,241,0.3)" : "linear-gradient(135deg,#a5b4fc,#6366f1)",
          border:"none",borderRadius:12,color:"#fff",fontSize:14,fontWeight:600,
          cursor: loading ? "default" : "pointer",
          boxShadow: loading ? "none" : "0 8px 20px rgba(99,102,241,0.3)",
          marginBottom:10
        }}>
          {loading ? "Please waitâ€¦" : "Continue"}
        </button>

        <button onClick={continueAsGuest} disabled={loading} style={{
          width:"100%",padding:"11px",
          background:"transparent",
          border:"none",
          color:"#6b7280",
          fontFamily:"'Inter',sans-serif",
          fontSize:12.5,fontWeight:500,
          cursor: loading ? "default" : "pointer",
          marginBottom:14
        }}>
          Try without profile
        </button>

        <div style={{ textAlign:"center",fontSize:10.5,color:"#4b5563",lineHeight:1.7 }}>
          Your profile and study sets stay on this device.
        </div>
      </div>
    </div>
  );
}

  const handleSave = () => {
    if (justSaved) return;
    onSave({
      id: genId(),
      topic: topic.length > 40 ? topic.slice(0,40)+"â€¦" : topic,
      mode,
      data,
      savedAt: Date.now()
    });
    setJustSaved(true);
  };
  if (justSaved) {
    return (
      <div style={{ display:"flex",alignItems:"center",gap:6,padding:"6px 12px",background:"rgba(34,197,94,0.08)",border:"1px solid rgba(34,197,94,0.2)",borderRadius:8,fontSize:11,color:"#86efac",fontWeight:600,fontFamily:"'Inter',sans-serif" }}>
        <span>âś“</span> Saved to study sets

    );

  return (
    <button onClick={handleSave} style={{ display:"flex",alignItems:"center",gap:6,padding:"7px 14px",background:"rgba(99,102,241,0.08)",border:"1px solid rgba(99,102,241,0.25)",borderRadius:8,fontSize:11,color:"#a5b4fc",fontWeight:600,cursor:"pointer",fontFamily:"'Inter',sans-serif",transition:"all 0.15s" }}

}

function CopyButton({ text }) {
  const [copied, setCopied] = useState(false);
  const onClick = async () => {
    const ok = await copyToClipboard(text);
    if (ok) {
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    }
  };
  return (
    <button title={copied ? "Copied!" : "Copy"} onClick={onClick} style={{ width:28,height:28,borderRadius:7,background: copied ? "rgba(34,197,94,0.15)" : "rgba(255,255,255,0.03)",border: copied ? "1px solid rgba(34,197,94,0.4)" : "1px solid rgba(255,255,255,0.06)",color: copied ? "#86efac" : "#6b7280",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s" }}>

        ? <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>

}

// GUEST UPGRADE MODAL â€” prompts guest to create a local profile
// when they try to save a study set
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function GuestUpgradeModal({ onClose, onCreate }) {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = () => {
    setErr("");
    if (!name.trim()) { setErr("Please enter your name."); return; }
    if (!email.includes("@") || !email.includes(".")) { setErr("Please enter a valid email."); return; }
    setLoading(true);
    try {
      const userKey = `yolvi:user:${email.toLowerCase()}`;
      let user;
      try {
        const existing = localStorage.getItem(userKey);
        if (existing) {
          user = JSON.parse(existing);
          let migrated = false;
          if (user && "password" in user) { delete user.password; migrated = true; }
          if (user.name !== name.trim()) { user.name = name.trim(); migrated = true; }
          if (migrated) {
            try { localStorage.setItem(userKey, JSON.stringify(user)); } catch(e) {}
          }
        }
      } catch(e) {}
      if (!user) {
        user = { name: name.trim(), email: email.toLowerCase(), createdAt: Date.now() };
        localStorage.setItem(userKey, JSON.stringify(user));
      }
      localStorage.setItem("yolvi:session", email.toLowerCase());
      onCreate(user);
    } catch(e) {
      setErr("Something went wrong. Try again.");
      setLoading(false);
    }
  };

  return (
    <div onClick={onClose} style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",backdropFilter:"blur(6px)",zIndex:90,display:"flex",alignItems:"center",justifyContent:"center",padding:24,fontFamily:"'Inter',sans-serif",animation:"yfadeIn 0.2s ease",overflow:"auto" }}>
      <div onClick={e=>e.stopPropagation()} style={{ width:"100%",maxWidth:380,background:"linear-gradient(180deg,#1a1a35,#0f0f24)",border:"1px solid rgba(99,102,241,0.25)",borderRadius:20,padding:"28px 24px",position:"relative",boxShadow:"0 20px 60px rgba(0,0,0,0.6),0 0 60px rgba(99,102,241,0.15)" }}>
        <style>{`
          .y-gu-input{background:rgba(255,255,255,0.04)!important;border:1.5px solid rgba(255,255,255,0.08)!important;border-radius:11px!important;padding:12px 14px!important;color:#fff!important;font-family:'Inter',sans-serif!important;font-size:13.5px!important;font-weight:400!important;width:100%!important;transition:all 0.2s!important;box-sizing:border-box!important;}
          .y-gu-input:focus{outline:none!important;border-color:#6366f1!important;background:rgba(99,102,241,0.05)!important;}
          .y-gu-input::placeholder{color:#4b5563!important;}
        `}</style>
        <button onClick={onClose} aria-label="Close" style={{ position:"absolute",top:14,right:14,width:28,height:28,borderRadius:"50%",background:"rgba(255,255,255,0.06)",border:"none",color:"#9ca3af",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center" }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
        </button>

        <div style={{ textAlign:"center",marginBottom:18 }}>
          <div style={{ fontSize:36,marginBottom:10 }}>đź’ľ</div>
          <div style={{ fontSize:18,fontWeight:700,color:"#fff",marginBottom:6,letterSpacing:"-0.02em" }}>
            Create a free local profile to save this study set.
          </div>
          <div style={{ fontSize:12,color:"#9ca3af",lineHeight:1.5 }}>
            Stored locally on your device.<br/>No account, no password.
          </div>
        </div>

        <div style={{ display:"flex",flexDirection:"column",gap:10,marginBottom:14 }}>
          <input className="y-gu-input" placeholder="Your name" value={name} onChange={e=>{setName(e.target.value); setErr("");}} onKeyDown={e=>e.key==="Enter"&&submit()}/>
          <input className="y-gu-input" type="email" placeholder="Email address" value={email} onChange={e=>{setEmail(e.target.value); setErr("");}} onKeyDown={e=>e.key==="Enter"&&submit()}/>
        </div>

        {err && <div style={{ marginBottom:12,padding:"9px 13px",fontSize:11.5,color:"#fca5a5",background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:9,textAlign:"center" }}>{err}</div>}

        <button onClick={submit} disabled={loading} style={{
          width:"100%",padding:"13px",
          background: loading ? "rgba(99,102,241,0.3)" : "linear-gradient(135deg,#a5b4fc,#6366f1)",
          border:"none",borderRadius:11,color:"#fff",fontFamily:"'Inter',sans-serif",fontSize:13.5,fontWeight:700,
          cursor: loading ? "default" : "pointer",
          boxShadow: loading ? "none" : "0 6px 18px rgba(99,102,241,0.32)",
          marginBottom:8
        }}>
          {loading ? "Please waitâ€¦" : "Create profile & save"}
        </button>
        <button onClick={onClose} style={{ width:"100%",padding:"9px",background:"transparent",border:"none",color:"#6b7280",fontFamily:"'Inter',sans-serif",fontSize:11.5,cursor:"pointer" }}>
          Cancel
        </button>
      </div>
    </div>
  );
}

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
// QUIZ MODE â€” interactive quiz with scoring, timer, end-of-quiz
// review of wrong answers, and keyboard shortcuts (1-4, Enter)
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function QuizView({ data, onClose }) {
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const [wrong, setWrong] = useState([]); // [{ qIdx, picked }]
  const [startedAt] = useState(() => Date.now());
  const [elapsed, setElapsed] = useState(0);
  const [showReview, setShowReview] = useState(false);

  const q = data.questions[idx];

  const pick = (i) => {
    if (picked !== null) return;
    setPicked(i);
    if (i === q.correct) setScore(s => s + 1);
    else setWrong(w => [...w, { qIdx: idx, picked: i }]);
  };

  const next = () => {
    if (idx + 1 < data.questions.length) {
      setIdx(idx + 1);
      setPicked(null);
    } else {
      setElapsed(Date.now() - startedAt);
      setDone(true);
    }
  };

  const restart = () => {
    setIdx(0); setPicked(null); setScore(0); setWrong([]); setDone(false); setShowReview(false);
  };

  // Keyboard shortcuts: 1-4 to pick, Enter to advance to next question.
  useEffect(() => {
    if (done) return;
    const handler = (e) => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      if (picked === null) {
        const num = parseInt(e.key, 10);
        if (!isNaN(num) && num >= 1 && num <= q.options.length) {
          e.preventDefault();
          pick(num - 1);
        }
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        next();
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [picked, idx, done]);

  if (done) {
    const pct = Math.round((score / data.questions.length) * 100);
    const perfect = pct === 100;

    if (showReview && wrong.length > 0) {
      return (
        <div style={{ padding:"20px",maxHeight:"70vh",overflowY:"auto" }}>
          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14 }}>
            <div style={{ fontSize:14,fontWeight:700,color:"#fff" }}>Review Â· {wrong.length} missed</div>
            <button onClick={()=>setShowReview(false)} style={{ background:"transparent",border:"none",color:"#9ca3af",cursor:"pointer",fontSize:11 }}>â† Back</button>
          </div>
          <div style={{ display:"flex",flexDirection:"column",gap:12 }}>
            {wrong.map((w, i) => {
              const wq = data.questions[w.qIdx];
              return (
                <div key={i} style={{ padding:"12px 14px",background:"rgba(239,68,68,0.05)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:11 }}>
                  <div style={{ fontSize:13,color:"#fff",fontWeight:600,marginBottom:8,lineHeight:1.4 }}>{wq.q}</div>
                  <div style={{ fontSize:12,color:"#fca5a5",marginBottom:4 }}>
                    <span style={{ opacity:0.8 }}>Your answer:</span> {wq.options[w.picked]}
                  </div>
                  <div style={{ fontSize:12,color:"#86efac",marginBottom:8 }}>
                    <span style={{ opacity:0.8 }}>Correct:</span> {wq.options[wq.correct]}
                  </div>
                  <div style={{ fontSize:11.5,color:"#c7d2fe",lineHeight:1.5,padding:"7px 10px",background:"rgba(99,102,241,0.06)",borderRadius:7 }}>đź’ˇ {wq.explain}</div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    return (
      <div style={{ padding:"24px 20px",textAlign:"center",position:"relative",overflow:"hidden" }}>
        {perfect && (
          <div aria-hidden="true" style={{ position:"absolute",inset:0,pointerEvents:"none",zIndex:0 }}>
            {[...Array(20)].map((_, i) => (
              <span key={i} style={{
                position:"absolute",
                left: `${(i*53)%100}%`,
                top: `-10px`,
                fontSize: 18 + (i%5)*4,
                animation: `yconfetti 2.4s ${(i%7)*0.15}s ease-out forwards`,
                opacity: 0.85
              }}>{["đźŽ‰","âś¨","â­","đźŽŠ","đź’«"][i%5]}</span>
            ))}
          </div>
        )}
        <div style={{ position:"relative",zIndex:1 }}>
          <div style={{ fontSize:14,color:"#818cf8",fontWeight:600,letterSpacing:"0.08em",marginBottom:18,textTransform:"uppercase" }}>Quiz complete</div>
          <div style={{ fontSize:48,fontWeight:800,color:"#fff",marginBottom:6 }}>{score}/{data.questions.length}</div>
          <div style={{ fontSize:14,color:"#9ca3af",marginBottom:6 }}>{perfect ? "đźŽ‰ Perfect score!" : pct >= 80 ? "đźŽ‰ Excellent!" : pct >= 60 ? "đź‘Ť Good effort!" : "đź’Ş Keep practicing!"}</div>
          <div style={{ fontSize:11,color:"#6b7280",marginBottom:22 }}>Time: {formatDuration(elapsed)} Â· Accuracy: {pct}%</div>
          <div style={{ display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap" }}>
            {wrong.length > 0 && (
              <button onClick={()=>setShowReview(true)} style={{ padding:"10px 16px",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:10,color:"#fca5a5",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"'Inter',sans-serif" }}>Review {wrong.length} missed</button>
            )}
            <button onClick={restart} style={{ padding:"10px 16px",background:"rgba(99,102,241,0.12)",border:"1px solid rgba(99,102,241,0.3)",borderRadius:10,color:"#a5b4fc",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"'Inter',sans-serif" }}>Try Again</button>
            <button onClick={onClose} style={{ padding:"10px 16px",background:"linear-gradient(135deg,#a5b4fc,#6366f1)",border:"none",borderRadius:10,color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"'Inter',sans-serif" }}>Done</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ padding:"20px" }}>
      <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16 }}>
        <div style={{ fontSize:11,color:"#9ca3af",letterSpacing:"0.08em",fontWeight:600 }}>Question {idx + 1} / {data.questions.length}</div>
        <div style={{ fontSize:11,color:"#818cf8",fontWeight:600 }}>Score: {score}</div>
      </div>
      {/* Progress bar */}
      <div style={{ height:4,background:"rgba(255,255,255,0.05)",borderRadius:2,marginBottom:18,overflow:"hidden" }}>
        <div style={{ height:"100%",background:"linear-gradient(90deg,#a5b4fc,#6366f1)",width:`${((idx) / data.questions.length) * 100}%`,transition:"width 0.3s" }}/>
      </div>

      <div style={{ fontSize:16,color:"#fff",fontWeight:500,marginBottom:18,lineHeight:1.5 }}>{q.q}</div>

      <div style={{ display:"flex",flexDirection:"column",gap:8 }}>
        {q.options.map((opt, i) => {
          const isCorrect = i === q.correct;
          const isPicked = i === picked;
          let bg = "rgba(255,255,255,0.03)", border = "rgba(255,255,255,0.08)", color = "#d1d5db";
          if (picked !== null) {
            if (isCorrect) { bg = "rgba(34,197,94,0.12)"; border = "#22c55e"; color = "#86efac"; }
            else if (isPicked) { bg = "rgba(239,68,68,0.12)"; border = "#ef4444"; color = "#fca5a5"; }
          }
          return (
            <button key={i} onClick={()=>pick(i)} disabled={picked !== null} style={{

// FLASHCARDS MODE â€” flippable cards with shuffle + keyboard nav
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function FlashcardsView({ data, onClose }) {
  const [order, setOrder] = useState(() => data.cards.map((_, i) => i));
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const c = data.cards[order[idx]];

  const next = () => { if (idx + 1 < order.length) { setIdx(idx + 1); setFlipped(false); } };
  const prev = () => { if (idx > 0) { setIdx(idx - 1); setFlipped(false); } };
  const shuffle = () => {
    const arr = [...order];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    setOrder(arr); setIdx(0); setFlipped(false);
  };
  const reset = () => {
    setOrder(data.cards.map((_, i) => i)); setIdx(0); setFlipped(false);
  };

  // Keyboard: Space/Enter to flip, â†/â†’ to navigate.
  useEffect(() => {
    const handler = (e) => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); setFlipped(f => !f); }
      else if (e.key === "ArrowRight") { e.preventDefault(); next(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, order]);

  return (
    <div style={{ padding:"20px" }}>
      <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14 }}>
        <div style={{ fontSize:11,color:"#9ca3af",letterSpacing:"0.08em",fontWeight:600 }}>Card {idx + 1} / {order.length}</div>
        <div style={{ display:"flex",gap:6 }}>
          <button onClick={shuffle} title="Shuffle cards" style={{ padding:"5px 9px",background:"rgba(99,102,241,0.08)",border:"1px solid rgba(99,102,241,0.22)",borderRadius:7,color:"#a5b4fc",cursor:"pointer",fontSize:10.5,fontWeight:600,fontFamily:"'Inter',sans-serif" }}>đź”€ Shuffle</button>
          <button onClick={reset} title="Reset order" style={{ padding:"5px 9px",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:7,color:"#9ca3af",cursor:"pointer",fontSize:10.5,fontWeight:600,fontFamily:"'Inter',sans-serif" }}>Reset</button>
          <button onClick={onClose} style={{ background:"transparent",border:"none",color:"#6b7280",cursor:"pointer",fontSize:11 }}>Close</button>
        </div>
      </div>
      <div style={{ height:4,background:"rgba(255,255,255,0.05)",borderRadius:2,marginBottom:18,overflow:"hidden" }}>
        <div style={{ height:"100%",background:"linear-gradient(90deg,#a5b4fc,#6366f1)",width:`${((idx + 1) / order.length) * 100}%`,transition:"width 0.3s" }}/>
      </div>

      <div onClick={()=>setFlipped(!flipped)} style={{
        cursor:"pointer",minHeight:180,padding:"30px 22px",
        background: flipped ? "linear-gradient(135deg,rgba(251,191,36,0.08),rgba(245,158,11,0.04))" : "linear-gradient(135deg,rgba(99,102,241,0.1),rgba(165,180,252,0.05))",
        border: `1.5px solid ${flipped ? "rgba(251,191,36,0.25)" : "rgba(99,102,241,0.25)"}`,
        borderRadius:16,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",textAlign:"center",
        transition:"all 0.3s"
      }}>
        <div style={{ fontSize:9,letterSpacing:"0.18em",fontWeight:600,marginBottom:14,color: flipped ? "#fbbf24" : "#818cf8" }}>{flipped ? "ANSWER" : "QUESTION"}</div>
        <div style={{ fontSize: flipped ? 14 : 16,fontWeight:flipped?400:600,color:"#fff",lineHeight:1.5 }}>{flipped ? c.back : c.front}</div>
        <div style={{ fontSize:10,color:"#6b7280",marginTop:18 }}>Tap or press Space to {flipped ? "see question" : "reveal answer"}</div>
      </div>

      <div style={{ display:"flex",gap:8,marginTop:14 }}>
        <button onClick={prev} disabled={idx===0} style={{ flex:1,padding:"11px",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:10,color:idx===0?"#374151":"#d1d5db",fontSize:12,fontWeight:600,cursor:idx===0?"default":"pointer" }}>â† Previous</button>
        <button onClick={next} disabled={idx + 1 >= order.length} style={{ flex:1,padding:"11px",background: idx+1>=order.length ? "rgba(255,255,255,0.04)" : "linear-gradient(135deg,#a5b4fc,#6366f1)",border:"none",borderRadius:10,color: idx+1>=order.length ? "#374151" : "#fff",fontSize:12,fontWeight:600,cursor: idx+1>=order.length ? "default" : "pointer" }}>Next â†’</button>
      </div>
    </div>
  );
}

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
// MAIN APP
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function Yolvi() {
  const [authChecked, setAuthChecked] = useState(false);
  const [currentUser, setCurrentUser] = useState(null);

  const [view, setView] = useState("home"); // home | mode
  const [mode, setMode] = useState(null); // explain | quiz | flashcards | summarize | homework
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [loadingSlow, setLoadingSlow] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [settingsPage, setSettingsPage] = useState(null); // null | "privacy" | "terms" | "contact" | "report"
  const [quizCount, setQuizCount] = useState(5);
  const [flashCount, setFlashCount] = useState(10);
  const [savedStudySets, setSavedStudySets] = useState([]);
  const [pendingGuestSave, setPendingGuestSave] = useState(null); // {topic, mode, data} when guest tries to save
  const [feedback, setFeedback] = useState({}); // { [messageIdx]: "up" | "down" }
  const [savedFilter, setSavedFilter] = useState("all"); // "all" | "quiz" | "flashcards"
  const [savedSearch, setSavedSearch] = useState("");
  const [streak, setStreak] = useState(0);
  const [reportText, setReportText] = useState("");

  const addStudySet = (set) => {
    // If user is a guest, intercept the save and prompt them to create a profile.
    // The pending set is saved automatically once they create it.
    if (currentUser && currentUser.isGuest) {
      requestGuestSave(set);
      return;
    }
    setSavedStudySets(prev => [set, ...prev.filter(s => s.id !== set.id)]);
  };
  const removeStudySet = (id) => {
    setSavedStudySets(prev => prev.filter(s => s.id !== id));
  };
  const openStudySet = (set) => {
    setMode(set.mode); setView("mode");
    setMessages([
      { role:"user", content: set.topic },
      { role:"assistant", content: "", structured: set.data, mode: set.mode, topic: set.topic, fromSaved: true }
    ]);
    setInput("");
  };




  const bottomRef = useRef(null);
  const taRef = useRef(null);


  // Load saved study sets and streak for a given email.
  // If no data exists, reset to empty/zero so nothing leaks across profiles.
  const loadUserData = (email) => {
    let sets = [];
    try {
      const setsRaw = localStorage.getItem(`yolvi:sets:${email}`);
      if (setsRaw) {
        const parsed = JSON.parse(setsRaw);
        if (Array.isArray(parsed)) sets = parsed;
      }
    } catch(e) {}
    setSavedStudySets(sets);

    // Load + update streak: if last visit was yesterday, +1; if today, unchanged; else reset to 1.
    try {
      const sKey = `yolvi:streak:${email}`;
      const today = new Date().toDateString();
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      let s = { lastVisit: null, streak: 0 };
      try { const raw = localStorage.getItem(sKey); if (raw) s = JSON.parse(raw); } catch(_) {}
      if (s.lastVisit !== today) {
        const next = s.lastVisit === yesterday ? (s.streak || 0) + 1 : 1;
        s = { lastVisit: today, streak: next };
        try { localStorage.setItem(sKey, JSON.stringify(s)); } catch(_) {}
      }
      setStreak(s.streak || 0);
    } catch(e) { setStreak(0); }
  };

  useEffect(() => {
    try {
      const session = localStorage.getItem("yolvi:session");
      if (session) {
        const u = localStorage.getItem(`yolvi:user:${session}`);
        if (u) {
          let user = JSON.parse(u);
          // Migration: strip out any legacy "password" field from older versions
          if (user && "password" in user) {
            delete user.password;
            try { localStorage.setItem(`yolvi:user:${session}`, JSON.stringify(user)); } catch(e) {}
          }
          setCurrentUser(user);
          loadUserData(session);
        }
      }
    } catch(e) {}
    setAuthChecked(true);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior:"smooth" }); }, [messages, loading]);

  // Persist saved study sets â€” only for non-guest users with an email
  useEffect(() => {
    if (!currentUser || currentUser.isGuest || !currentUser.email) return;
    try {
      localStorage.setItem(`yolvi:sets:${currentUser.email}`, JSON.stringify(savedStudySets));
    } catch(e) {}
  }, [savedStudySets, currentUser]);

  const handleAuth = (user) => {
    setCurrentUser(user);
    loadUserData(user.email);
    setView("home");
    setMode(null);
    setMessages([]);
    setInput("");
    setFeedback({});
    setSavedFilter("all");
    setShowSettings(false);
  };

  // Sign in as a temporary in-memory guest. No localStorage profile is written.
  const handleGuest = () => {
    setCurrentUser({ name: "Guest", email: null, isGuest: true });
    setSavedStudySets([]);
    setStreak(0);
    setView("home");
    setMode(null);
    setMessages([]);
    setInput("");
    setFeedback({});
    setSavedFilter("all");
    setShowSettings(false);
  };

  // Called by SaveSetButton when a guest user tries to save.
  // We hold the set aside, show the upgrade modal, and save it after profile creation.
  const requestGuestSave = (set) => {
    setPendingGuestSave(set);
  };

  // Called by GuestUpgradeModal after the user creates a real profile.
  // Critical: we must NOT lose the currently-generated quiz/flashcards. We keep
  // existing messages, mode and view, only swap currentUser + load that user's saved sets,
  // then save the pending set.
  const handleGuestUpgrade = (user) => {
    const pending = pendingGuestSave;
    setCurrentUser(user);

    // Load the new user's saved sets into memoryâ€¦
    let existingSets = [];
    try {
      const setsRaw = localStorage.getItem(`yolvi:sets:${user.email}`);
      if (setsRaw) {
        const parsed = JSON.parse(setsRaw);
        if (Array.isArray(parsed)) existingSets = parsed;
      }
    } catch(e) {}

    // â€¦then prepend the pending set if any.
    if (pending) {
      setSavedStudySets([pending, ...existingSets.filter(s => s.id !== pending.id)]);
    } else {
      setSavedStudySets(existingSets);
    }

    // Bring streak in line with the new profile.
    try {
      const sKey = `yolvi:streak:${user.email}`;
      const today = new Date().toDateString();
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      let s = { lastVisit: null, streak: 0 };
      try { const raw = localStorage.getItem(sKey); if (raw) s = JSON.parse(raw); } catch(_) {}
      if (s.lastVisit !== today) {
        const next = s.lastVisit === yesterday ? (s.streak || 0) + 1 : 1;
        s = { lastVisit: today, streak: next };
        try { localStorage.setItem(sKey, JSON.stringify(s)); } catch(_) {}
      }
      setStreak(s.streak || 0);
    } catch(_) {}

    setPendingGuestSave(null);
    // Intentionally do NOT reset view/mode/messages â€” the user keeps their quiz/flashcards on screen.
  };

  // "Switch profile" â€” fully clear all in-memory app state so nothing
  // leaks into the next profile that signs in.
  const handleLogout = () => {
    try { localStorage.removeItem("yolvi:session"); } catch(e) {}
    setCurrentUser(null);
    setView("home");
    setMode(null);
    setMessages([]);
    setInput("");
    setSavedStudySets([]);
    setFeedback({});
    setSavedFilter("all");
    setStreak(0);
    setShowSettings(false);
    setSettingsPage(null);
  };

  const handleDeleteAccount = () => {
    if (!confirm("Delete your local profile and all saved study sets from this device? This cannot be undone.")) return;
    try {
      if (currentUser && currentUser.email) {
        localStorage.removeItem(`yolvi:user:${currentUser.email}`);
        localStorage.removeItem(`yolvi:sets:${currentUser.email}`);
        localStorage.removeItem(`yolvi:streak:${currentUser.email}`);
        // Legacy: remove old daily counter key if it exists from previous versions
        localStorage.removeItem(`yolvi:daily:${currentUser.email}`);
      }
      localStorage.removeItem("yolvi:session");
    } catch(e) {}
    setSavedStudySets([]);
    setFeedback({});
    setStreak(0);
    handleLogout();
  };

  const startMode = (m) => {
    setMode(m); setView("mode"); setMessages([]); setInput(""); setSavedSearch("");
  };

  const goHome = () => { setView("home"); setMode(null); setMessages([]); setInput(""); setFeedback({}); };

  // Send a report email via the user's mail client. Honest fallback when there's no backend.
  const sendReport = () => {
    const body = (reportText || "").trim();
    if (!body) return;
    const subject = encodeURIComponent("Yolvi â€” problem report");
    const fullBody = encodeURIComponent(
      `What happened:\n${body}\n\n---\nProfile: ${currentUser?.email || "guest"}\nApp: Yolvi v1.0`
    );
    try { window.location.href = `mailto:${SUPPORT_EMAIL}?subject=${subject}&body=${fullBody}`; } catch(e) {}
    setReportText("");
    setSettingsPage(null);
  };

  // Single fetch with timeout â€” bails out cleanly if the server hangs.
  const fetchWithTimeout = async (url, timeoutMs) => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { signal: controller.signal });
      return res;
    } finally {
      clearTimeout(timer);
    }
  };

  // One generation request â€” with timeout + automatic retry once on timeout/network failure.
  // Pollinations sometimes takes 1â€“3s, sometimes hangs forever; the 30s timeout catches the hangs.
  const generateOnce = async (currentMode, text, extraReminder) => {
    const systemMap = {
      explain: SYSTEM_EXPLAIN,
      quiz: SYSTEM_QUIZ_TEMPLATE.replace("{COUNT}", String(quizCount)),
      flashcards: SYSTEM_FLASHCARDS_TEMPLATE.replace("{COUNT}", String(flashCount)),
      summarize: SYSTEM_SUMMARIZE,
      homework: SYSTEM_HOMEWORK,
    };
    const sysPrompt = (systemMap[currentMode] || SYSTEM_BASE) + (extraReminder ? "\n\n" + extraReminder : "");
    const fullPrompt = sysPrompt + "\n\nUser request: " + text;

    // Try up to 2 times, with a fresh seed each attempt
    let lastErr;
    for (let attempt = 0; attempt < 2; attempt++) {
      const url = "https://text.pollinations.ai/" + encodeURIComponent(fullPrompt) +
        "?model=openai&seed=" + Math.floor(Math.random() * 99999) + "&private=true";
      try {
        const res = await fetchWithTimeout(url, 30000);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const txt = (await res.text()).trim();
        if (!txt) throw new Error("Empty response");
        return txt;
      } catch (err) {
        lastErr = err;
        // Retry once on timeout/abort/network error; don't retry on HTTP errors
        if (err.name !== "AbortError" && !String(err.message).includes("Failed to fetch") && !String(err.message).includes("Empty")) {
          throw err;
        }
      }
    }
    throw lastErr || new Error("Request failed after retries");
  };

  const send = async (overrideText, fromClarification) => {
    // Allow callers (like ClarifyView suggestions) to send directly without going through input state.
    // Run through normalizeStudyRequest so common typos and helper phrases ("quiz abou WW2",
    // "make a quiz about photosynthesis") are reduced to the actual study topic before sending.
    const rawText = (typeof overrideText === "string" ? overrideText : input).trim();
    const text = normalizeStudyRequest(rawText);
    if (!text || loading) return;

    // Snapshot the mode at the moment of sending so async state changes can't switch us mid-flight.
    const sendMode = mode;

    setMessages(prev => [...prev, { role:"user", content:text }]);
    setInput("");
    if (taRef.current) taRef.current.style.height = "auto";
    setLoading(true);
    setLoadingSlow(false);
    const slowTimer = setTimeout(() => setLoadingSlow(true), 8000);

    try {
      // If user already picked a clarification suggestion, force AI to generate directly.
      const userClarifiedReminder = fromClarification
        ? "The user has already specified what they want. DO NOT ask for clarification again. Generate the content directly."
        : null;
      let reply = await generateOnce(sendMode, text, userClarifiedReminder);

      if (sendMode === "quiz" || sendMode === "flashcards") {
        let parsed = extractJson(reply);
        let hasQuiz = parsed && Array.isArray(parsed.questions) && parsed.questions.length > 0;
        let hasCards = parsed && Array.isArray(parsed.cards) && parsed.cards.length > 0;
        const correctShape = (sendMode === "quiz" && hasQuiz) || (sendMode === "flashcards" && hasCards);
        const wrongShape = !correctShape && (hasQuiz || hasCards);

        // If we got the wrong shape, retry ONCE with a stronger reminder.
        if (wrongShape) {
          const reminder = sendMode === "quiz"
            ? `CRITICAL: respond with a 'questions' array (multiple choice quiz). DO NOT respond with a 'cards' array. The topic "${text}" is specific enough â€” do NOT ask for clarification. Generate exactly ${quizCount} questions; if the topic is broad (e.g. WW2, history, biology), spread the questions across the main subtopics â€” for example a 20-question WW2 quiz should cover causes, major events, leaders, battles, Holocaust, home front, end of war, and consequences.`
            : `CRITICAL: respond with a 'cards' array (front/back flashcards). DO NOT respond with a 'questions' array. The topic "${text}" is specific enough â€” do NOT ask for clarification. Generate exactly ${flashCount} flashcards; if the topic is broad (e.g. WW2, history, biology), spread the flashcards across the main subtopics â€” for example 20 WW2 flashcards should cover causes, major events, leaders, battles, Holocaust, home front, end of war, and consequences.`;
          try {
            reply = await generateOnce(sendMode, text, reminder);
            parsed = extractJson(reply);
            hasQuiz = parsed && Array.isArray(parsed.questions) && parsed.questions.length > 0;
            hasCards = parsed && Array.isArray(parsed.cards) && parsed.cards.length > 0;
          } catch(e) { /* keep original parsed */ }
        }

        // Now decide what to render
        if (parsed && parsed.needsClarification) {
          // Do not allow the AI to ask for clarification for normal broad study topics.
          // Broad topics like WW2, history, biology, math, photosynthesis, etc. should generate directly.
          // Only a small allow-list of truly ambiguous single words (Mercury, Apple, Java, ...) is allowed.
          if (shouldAllowClarification(text)) {
            setMessages(prev => [...prev, { role:"assistant", clarify: parsed, mode: sendMode, topic: text }]);
          } else {
            const forceReminder = sendMode === "quiz"
              ? `The topic "${text}" is specific enough. Do NOT ask for clarification. Generate exactly ${quizCount} multiple-choice questions now. If the topic is broad (e.g. WW2, history, biology), create a general overview quiz that spreads across the main subtopics â€” for example a 20-question WW2 quiz should cover causes, major events, leaders, battles, Holocaust, home front, end of war, and consequences. Output JSON only with a questions array.`
              : `The topic "${text}" is specific enough. Do NOT ask for clarification. Generate exactly ${flashCount} flashcards now. If the topic is broad (e.g. WW2, history, biology), create general overview flashcards that spread across the main subtopics â€” for example 20 WW2 flashcards should cover causes, major events, leaders, battles, Holocaust, home front, end of war, and consequences. Output JSON only with a cards array.`;

            try {
              reply = await generateOnce(sendMode, text, forceReminder);
              parsed = extractJson(reply);

              const retryHasQuiz = parsed && Array.isArray(parsed.questions) && parsed.questions.length > 0;
              const retryHasCards = parsed && Array.isArray(parsed.cards) && parsed.cards.length > 0;

            {modes.map(m => (
              <button key={m.id} className="y-mode-card" onClick={()=>startMode(m.id)} style={{
                padding:"16px 18px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,
                cursor:"pointer",display:"flex",alignItems:"center",gap:14,textAlign:"left",fontFamily:"'Inter',sans-serif",
                position:"relative"
              }}>
                <div style={{ width:44,height:44,borderRadius:11,background:"rgba(99,102,241,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0 }}>{m.icon}</div>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:14.5,fontWeight:600,color:"#fff",marginBottom:2 }}>
                    {m.title}
                  </div>
                  <div style={{ fontSize:12,color:"#9ca3af" }}>{m.desc}</div>
                </div>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style={{ color:"#4b5563" }}><path d="M9 5l7 7-7 7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </button>
            ))}
          </div>

          <div style={{ textAlign:"center",fontSize:10,color:"#374151",marginTop:14,lineHeight:1.7 }}>
            AI can make mistakes. Check important facts.
          </div>
        </div>
      )}

      {/* MODE VIEW â€” Chat with selected mode */}
      {view === "mode" && (
        <>
          <div style={{ flex:1,overflowY:"auto",padding:"20px 20px 10px",display:"flex",flexDirection:"column",gap:16 }}>
            {messages.length === 0 && (
              <div>
                <div style={{ textAlign:"center",padding:"40px 20px 20px" }}>
                  <div style={{ fontSize:42,marginBottom:14 }}>{modes.find(m=>m.id===mode)?.icon}</div>
                  <div style={{ fontSize:16,fontWeight:600,color:"#fff",marginBottom:6 }}>{modes.find(m=>m.id===mode)?.title} mode</div>
                  <div style={{ fontSize:13,color:"#9ca3af",lineHeight:1.6,maxWidth:280,margin:"0 auto" }}>
                    {mode === "explain" && "Type a topic to get a clear explanation with examples."}
                    {mode === "quiz" && `Type a specific topic to generate a ${quizCount}-question quiz. Be specific â€” "WW2 in Europe" works better than just "history".`}
                    {mode === "flashcards" && `Type a specific topic to generate ${flashCount} flashcards. Be specific â€” "photosynthesis steps" works better than "biology".`}
                    {mode === "summarize" && "Paste your notes to get key points and test questions."}
                    {mode === "homework" && "Type your homework question to get step-by-step help."}
                  </div>
                </div>

                {/* Show ONLY this mode's saved sets in its own empty state.
                    Quiz mode shows only saved quizzes. Flashcards mode shows only saved flashcards.
                    Other modes show nothing. */}
                {(mode === "quiz" || mode === "flashcards") && savedStudySets.filter(s => s.mode === mode).length > 0 && (
                  <div style={{ padding:"10px 0 20px",maxWidth:520,margin:"0 auto" }}>
                    <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,paddingLeft:4,paddingRight:4 }}>
                      <div style={{ fontSize:10,letterSpacing:"0.16em",fontWeight:700,color:"#6b7280",textTransform:"uppercase" }}>
                        Your saved {mode === "quiz" ? "quizzes" : "flashcards"}
                      </div>
                      <div style={{ fontSize:10,color:"#4b5563" }}>{savedStudySets.filter(s => s.mode === mode).length} total</div>
                    </div>

                    {/* Search bar â€” only when there are enough saved sets to make searching useful */}
                    {savedStudySets.filter(s => s.mode === mode).length > 5 && (
                      <div style={{ marginBottom:9 }}>
                        <input
                          value={savedSearch}
                          onChange={e=>setSavedSearch(e.target.value)}
                          placeholder={`Search ${mode === "quiz" ? "quizzes" : "flashcards"}â€¦`}
                          style={{ width:"100%",padding:"9px 13px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:10,color:"#fff",fontFamily:"'Inter',sans-serif",fontSize:12,outline:"none" }}
                        />
                      </div>
                    )}

                    <div style={{ display:"flex",flexDirection:"column",gap:7 }}>
                      {modeSavedSets.length === 0 && savedSearch.trim() && (
                        <div style={{ padding:"14px",fontSize:12,color:"#6b7280",textAlign:"center" }}>No saved {mode==="quiz"?"quizzes":"flashcards"} match "{savedSearch}".</div>
                      )}
                      {modeSavedSets.slice(0, 8).map(set => (
                        <div key={set.id} style={{
                          padding:"11px 14px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",
                          borderRadius:11,display:"flex",alignItems:"center",gap:10
                        }}>
                          <div style={{ width:30,height:30,borderRadius:8,background: mode==="quiz" ? "rgba(99,102,241,0.1)" : "rgba(251,191,36,0.08)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0 }}>{mode==="quiz"?"đź“ť":"đźŹ"}</div>
                          <div onClick={()=>openStudySet(set)} style={{ flex:1,minWidth:0,cursor:"pointer" }}>
                            <div style={{ fontSize:12.5,fontWeight:600,color:"#fff",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis" }}>{set.topic}</div>
                            <div style={{ fontSize:10,color:"#6b7280",marginTop:1 }}>{mode==="quiz"?`${set.data.questions?.length||0} questions`:`${set.data.cards?.length||0} cards`} Â· saved {formatDate(set.savedAt)}</div>
                          </div>
                          <button onClick={()=>openStudySet(set)} title="Review" style={{ padding:"5px 10px",borderRadius:7,background:"rgba(99,102,241,0.1)",border:"1px solid rgba(99,102,241,0.22)",color:"#a5b4fc",cursor:"pointer",fontSize:10,fontWeight:600,fontFamily:"'Inter',sans-serif",flexShrink:0 }}>
                            Review
                          </button>
                          <button onClick={e=>{ e.stopPropagation(); removeStudySet(set.id); }} title="Delete" style={{ width:22,height:22,borderRadius:6,background:"transparent",border:"none",color:"#4b5563",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0 }}
                            onMouseEnter={e=>e.currentTarget.style.color="#fca5a5"}
                            onMouseLeave={e=>e.currentTarget.style.color="#4b5563"}>
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {messages.map((msg, i) => (
              <div key={i} className="y-bubble" style={{ display:"flex",flexDirection:msg.role==="user"?"row-reverse":"row",alignItems:"flex-start",gap:10 }}>
                {msg.role==="assistant" && <div style={{ flexShrink:0,marginTop:2 }}><Logo size={26}/></div>}
                <div style={{ maxWidth:"82%" }}>
                  {msg.role==="user"
                    ? <div style={{ padding:"11px 15px",fontSize:14,lineHeight:1.5,background:"linear-gradient(135deg,#a5b4fc,#6366f1)",borderRadius:"16px 16px 4px 16px",color:"#fff",boxShadow:"0 4px 12px rgba(99,102,241,0.2)" }}>{msg.content}</div>
                    : msg.clarify
                      ? <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:"16px 16px 16px 4px",overflow:"hidden" }}>
                          <ClarifyView data={msg.clarify} onPick={(suggestion) => send(suggestion, true)}/>
                        </div>
                    : msg.retryable
                      ? <div style={{ padding:"14px 18px",fontSize:14,lineHeight:1.65,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:"16px 16px 16px 4px",color:"#d1d5db" }}>
                          <div dangerouslySetInnerHTML={{ __html: renderMd(msg.content) }}/>
                          <button onClick={() => send(msg.retryable.text)} style={{ marginTop:10,padding:"8px 14px",background:"rgba(99,102,241,0.12)",border:"1px solid rgba(99,102,241,0.3)",borderRadius:8,color:"#a5b4fc",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"'Inter',sans-serif" }}>
                            đź”„ Try again
                          </button>
                        </div>
                    : msg.structured && Array.isArray(msg.structured.questions) && msg.structured.questions.length > 0
                      ? <div>
                          <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:"16px 16px 16px 4px",overflow:"hidden" }}>
                            <QuizView data={msg.structured} onClose={goHome}/>
                          </div>
                          {!msg.fromSaved && (
                            <div style={{ marginTop:8,display:"flex",justifyContent:"flex-start" }}>
                              <SaveSetButton topic={msg.topic || "Quiz"} mode="quiz" data={msg.structured} onSave={addStudySet}/>
                            </div>
                          )}
                        </div>
                      : msg.structured && Array.isArray(msg.structured.cards) && msg.structured.cards.length > 0
                        ? <div>
                            <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:"16px 16px 16px 4px",overflow:"hidden" }}>
                              <FlashcardsView data={msg.structured} onClose={goHome}/>
                            </div>
                            {!msg.fromSaved && (
                              <div style={{ marginTop:8,display:"flex",justifyContent:"flex-start" }}>
                                <SaveSetButton topic={msg.topic || "Flashcards"} mode="flashcards" data={msg.structured} onSave={addStudySet}/>
                              </div>
                            )}
                          </div>
                        : <div style={{ padding:"14px 18px",fontSize:14,lineHeight:1.65,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:"16px 16px 16px 4px",color:"#d1d5db" }}
                            dangerouslySetInnerHTML={{ __html: renderMd(msg.content) }}/>
                  }
                  {msg.role==="assistant" && !msg.structured && !msg.clarify && !msg.retryable && (
                    <div style={{ display:"flex",gap:6,marginTop:8 }}>
                      <CopyButton text={msg.content}/>
                      <button title="Helpful" onClick={()=>setFeedback(prev=>({...prev,[i]:"up"}))} style={{ width:28,height:28,borderRadius:7,background: feedback[i]==="up" ? "rgba(34,197,94,0.15)" : "rgba(255,255,255,0.03)",border: feedback[i]==="up" ? "1px solid rgba(34,197,94,0.4)" : "1px solid rgba(255,255,255,0.06)",color: feedback[i]==="up" ? "#86efac" : "#6b7280",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s" }}>đź‘Ť</button>
                      <button title="Not helpful" onClick={()=>setFeedback(prev=>({...prev,[i]:"down"}))} style={{ width:28,height:28,borderRadius:7,background: feedback[i]==="down" ? "rgba(239,68,68,0.12)" : "rgba(255,255,255,0.03)",border: feedback[i]==="down" ? "1px solid rgba(239,68,68,0.3)" : "1px solid rgba(255,255,255,0.06)",color: feedback[i]==="down" ? "#fca5a5" : "#6b7280",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s" }}>đź‘Ž</button>
                      <button title="Report a problem" onClick={()=>setSettingsPage("report")} style={{ width:28,height:28,borderRadius:7,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",color:"#6b7280",cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s" }}
                        onMouseEnter={e=>e.currentTarget.style.color="#fca5a5"}
                        onMouseLeave={e=>e.currentTarget.style.color="#6b7280"}>âš</button>
                    </div>
                  )}
                </div>
              </div>
            ))}

            {loading && (
              <div className="y-bubble" style={{ display:"flex",alignItems:"flex-start",gap:10 }}>
                <div style={{ flexShrink:0,marginTop:2 }}><Logo size={26}/></div>
                <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:"16px 16px 16px 4px",padding:"13px 18px",display:"flex",flexDirection:"column",gap:4 }}>
                  <Dots/>
                  {loadingSlow && <div style={{ fontSize:11,color:"#6b7280",fontStyle:"italic" }}>Still thinkingâ€¦ (server is slow today)</div>}
                </div>
              </div>
            )}
            <div ref={bottomRef}/>
          </div>

          {/* Quiz count picker â€” only visible in quiz mode, before first message */}
          {mode === "quiz" && messages.length === 0 && (
            <div style={{ padding:"0 20px 8px",flexShrink:0 }}>
              <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:12,padding:"12px 14px" }}>
                <div style={{ fontSize:11,color:"#9ca3af",letterSpacing:"0.06em",fontWeight:600,marginBottom:9,textTransform:"uppercase" }}>Number of questions</div>
                <div style={{ display:"flex",gap:6,flexWrap:"wrap" }}>
                  {[3,5,10,15,20].map(n => (
                    <button key={n} onClick={()=>setQuizCount(n)} style={{
                      flex:"1 1 50px",padding:"9px 8px",
                      background: quizCount === n ? "linear-gradient(135deg,#a5b4fc,#6366f1)" : "rgba(255,255,255,0.03)",
                      border: quizCount === n ? "1px solid #6366f1" : "1px solid rgba(255,255,255,0.07)",
                      borderRadius:9, color: quizCount === n ? "#fff" : "#9ca3af",
                      fontSize:13, fontWeight: quizCount === n ? 700 : 500,
                      cursor:"pointer", fontFamily:"'Inter',sans-serif", transition:"all 0.15s"
                    }}>{n}</button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Flashcard count picker â€” only visible in flashcards mode, before first message */}
          {mode === "flashcards" && messages.length === 0 && (
            <div style={{ padding:"0 20px 8px",flexShrink:0 }}>
              <div style={{ background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:12,padding:"12px 14px" }}>
                <div style={{ fontSize:11,color:"#9ca3af",letterSpacing:"0.06em",fontWeight:600,marginBottom:9,textTransform:"uppercase" }}>Number of flashcards</div>
                <div style={{ display:"flex",gap:6,flexWrap:"wrap" }}>
                  {[5,10,15,20,25].map(n => (
                    <button key={n} onClick={()=>setFlashCount(n)} style={{
                      flex:"1 1 50px",padding:"9px 8px",
                      background: flashCount === n ? "linear-gradient(135deg,#a5b4fc,#6366f1)" : "rgba(255,255,255,0.03)",
                      border: flashCount === n ? "1px solid #6366f1" : "1px solid rgba(255,255,255,0.07)",
                      borderRadius:9, color: flashCount === n ? "#fff" : "#9ca3af",
                      fontSize:13, fontWeight: flashCount === n ? 700 : 500,
                      cursor:"pointer", fontFamily:"'Inter',sans-serif", transition:"all 0.15s"
                    }}>{n}</button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Input */}
          <div style={{ padding:"12px 20px 16px",borderTop:"1px solid rgba(99,102,241,0.08)",flexShrink:0 }}>
            <div style={{ display:"flex",gap:10,alignItems:"flex-end",background:"rgba(255,255,255,0.04)",border: input.trim() ? "1.5px solid rgba(99,102,241,0.4)" : "1.5px solid rgba(255,255,255,0.06)",borderRadius:14,padding:"10px 10px 10px 14px",transition:"border-color 0.2s" }}>
              <textarea ref={taRef} value={input}
                onChange={e=>{ setInput(e.target.value); e.target.style.height="auto"; e.target.style.height=Math.min(e.target.scrollHeight,140)+"px"; }}
                onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();} }}
                placeholder={
                  mode === "explain" ? "What topic do you want to understand?" :
                  mode === "quiz" ? "What should the quiz be about? (e.g. 'WW2 causes', 'Spanish verbs')" :
                  mode === "flashcards" ? "What topic should the flashcards cover? (e.g. 'French food vocabulary')" :
                  mode === "summarize" ? "Paste your notes hereâ€¦" :
                  mode === "homework" ? "What's your homework question?" :
                  "Ask Yolviâ€¦"
                }
                rows={1}
                style={{ flex:1,background:"transparent",border:"none",color:"#fff",fontFamily:"'Inter',sans-serif",fontSize:14,fontWeight:400,lineHeight:1.5,caretColor:"#818cf8",maxHeight:140,overflowY:"auto" }}/>
              <button onClick={send} disabled={!input.trim() || loading} style={{ width:36,height:36,borderRadius:10,background: input.trim()&&!loading ? "linear-gradient(135deg,#a5b4fc,#6366f1)" : "rgba(255,255,255,0.04)",border:"none",color: input.trim()&&!loading ? "#fff" : "#4b5563",cursor: input.trim()&&!loading ? "pointer" : "default",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxShadow: input.trim()&&!loading ? "0 4px 12px rgba(99,102,241,0.3)" : "none" }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"/><path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </button>
            </div>
            <div style={{ textAlign:"center",marginTop:6,fontSize:9,color:"#374151" }}>AI can make mistakes. Check important facts.</div>
          </div>
        </>
      )}
    </div>
  );
}

// Small style helper for keyboard-shortcut keys.
const kbdStyle = {
  display:"inline-block",
  padding:"1px 7px",
  margin:"0 2px",
  background:"rgba(255,255,255,0.06)",
  border:"1px solid rgba(255,255,255,0.12)",
  borderBottomWidth:"2px",
  borderRadius:5,
  fontFamily:"'JetBrains Mono', monospace",
  fontSize:11,
  color:"#d1d5db"
};


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Yolvi));

  </script>
</body>
</html>
